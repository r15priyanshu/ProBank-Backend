server.port= 9091
spring.application.name=PROBANK-ACCOUNTS-SERVICE
logging.level.root=INFO

#CUSTOM PROPERTIES
app.environment=DEFAULT

#MYSQL RELATED CONFIGURATIONS
spring.datasource.url=jdbc:mysql://localhost:3306/probank
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#CONFIGURING CONFIG CLIENT
spring.config.import=optional:configserver:http://localhost:8888/

#CONFIGURING EUREKA CLIENT
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

#RABBITMQ CONNECTION DETAILS
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# OUTPUT BINDING FOR SENDING MESSAGES TO THE EXCHANGE
spring.cloud.stream.bindings.sendEmail-out-0.destination=email-exchange-request
spring.cloud.stream.bindings.sendSms-out-0.destination=sms-exchange-request

#DEFINING MULTIPLE FUNCTIONS WHICH MIGHT ACTS AS PRODUCER OR CONSUMER OF EVENTS
spring.cloud.function.definition=updateCommunicationEmail;updateCommunicationSms

#CREATING INPUT BINDINGS [ MEANS THIS WILL ACT AS CONSUMER AND LOOKS IN THE QUEUE WITH THE NAME EMAIL-QUEUE FOR MESSAGES AND THEN TRIGGER SENDEMAIL ]
spring.cloud.stream.bindings.updateCommunicationEmail-in-0.destination=email-exchange-response
spring.cloud.stream.bindings.updateCommunicationEmail-in-0.group=${spring.application.name}
spring.cloud.stream.bindings.updateCommunicationSms-in-0.destination=sms-exchange-response
spring.cloud.stream.bindings.updateCommunicationSms-in-0.group=${spring.application.name}

#REDIS CONFIGURATION
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=


#INTEGRATING FEIGN WITH CIRCUITBREAKER
spring.cloud.openfeign.circuitbreaker.enabled=true

#CIRCUIT BREAKER DEFAULT CONFIGS
resilience4j.circuitbreaker.configs.default.sliding-window-size=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10000

#ACTUATOR CONFIGS
management.endpoints.web.exposure.include=*
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.info.env.enabled=true
management.endpoint.env.show-values=always
management.endpoint.shutdown.enabled=true
endpoints.shutdown.enabled=true

#BELOW WILL BE SHOWN IN /actuator/info
info.app.name=PROBANK-ACCOUNTS-SERVICE
info.app.description=Microservice For Accounts
info.app.version=1.0.0


